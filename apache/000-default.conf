<VirtualHost *:80>
    # Define el nombre del host y la raiz publica de la aplicacion.
    ServerName 10.0.70.99
    DocumentRoot /var/www/html

    # Permite .htaccess y acceso al directorio servido por Apache.
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Redirige los errores HTTP comunes a las pantallas personalizadas del proyecto.
    ErrorDocument 403 /errors/403.php
    ErrorDocument 404 /errors/404.php

    # Separa los logs de este virtual host para facilitar diagnostico.
    ErrorLog ${APACHE_LOG_DIR}/cas3_error.log
    CustomLog ${APACHE_LOG_DIR}/cas3_access.log combined
</VirtualHost>
