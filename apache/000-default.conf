<VirtualHost *:80>
    # Defineix el nom del host i l'arrel publica de l'aplicacio.
    ServerName 10.0.70.99
    DocumentRoot /var/www/html

    # Permet .htaccess i l'acces al directori servit per Apache.
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Redirigeix els errors HTTP comuns a les pantalles personalitzades del projecte.
    ErrorDocument 403 /errors/403.php
    ErrorDocument 404 /errors/404.php

    # Separa els logs d'aquest virtual host per facilitar el diagnostic.
    ErrorLog ${APACHE_LOG_DIR}/cas3_error.log
    CustomLog ${APACHE_LOG_DIR}/cas3_access.log combined
</VirtualHost>
