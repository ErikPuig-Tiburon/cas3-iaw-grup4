<IfModule mod_ssl.c>
    <VirtualHost *:443>
        # Configuracion equivalente al sitio HTTP, pero sirviendo por TLS.
        ServerName 10.0.70.99
        DocumentRoot /var/www/html

        # Certificado autofirmado generado durante la construccion de la imagen.
        SSLEngine on
        SSLCertificateFile /etc/apache2/ssl/cas3-selfsigned.crt
        SSLCertificateKeyFile /etc/apache2/ssl/cas3-selfsigned.key

        # Permite .htaccess y acceso al directorio servido por Apache.
        <Directory /var/www/html>
            Options -Indexes +FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>

        # Mantiene las paginas de error personalizadas tambien en HTTPS.
        ErrorDocument 403 /errors/403.php
        ErrorDocument 404 /errors/404.php

        # Registros independientes para trafico y errores SSL.
        ErrorLog ${APACHE_LOG_DIR}/cas3_ssl_error.log
        CustomLog ${APACHE_LOG_DIR}/cas3_ssl_access.log combined
    </VirtualHost>
</IfModule>
