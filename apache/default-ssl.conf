<IfModule mod_ssl.c>
    <VirtualHost *:443>
        # Configuracio equivalent al lloc HTTP, pero servint per TLS.
        ServerName 10.0.70.99
        DocumentRoot /var/www/html

        # Certificat autofirmat generat durant la construccio de la imatge.
        SSLEngine on
        SSLCertificateFile /etc/apache2/ssl/cas3-selfsigned.crt
        SSLCertificateKeyFile /etc/apache2/ssl/cas3-selfsigned.key

        # Permet .htaccess i l'acces al directori servit per Apache.
        <Directory /var/www/html>
            Options -Indexes +FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>

        # Manté les pagines d'error personalitzades tambe en HTTPS.
        ErrorDocument 403 /errors/403.php
        ErrorDocument 404 /errors/404.php

        # Registres independents per al trafic i els errors SSL.
        ErrorLog ${APACHE_LOG_DIR}/cas3_ssl_error.log
        CustomLog ${APACHE_LOG_DIR}/cas3_ssl_access.log combined
    </VirtualHost>
</IfModule>
